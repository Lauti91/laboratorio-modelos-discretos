<style>
:root{

  --good:#17703d;--warn:#8f6200;--bad:#b3261e;--chip:#eceff3;
  --zone1:#f7dcc9;--zone2:#f0b98f;--okfill:#e3f1e8;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101318;--surface:#171b21;--fg:#e9ecf0;--muted:#a3adb9;--faint:#76808c;
  --line:#262c35;--line2:#434b57;--demand:#f27a45;--supply:#6aa4f2;--c3:#b595e8;
  --good:#58c88a;--warn:#e0b04a;--bad:#f2837b;--chip:#222831;
  --zone1:#4a3022;--zone2:#7a4a2a;--okfill:#1f3a2b;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101318;--surface:#171b21;--fg:#e9ecf0;--muted:#a3adb9;--faint:#76808c;
  --line:#262c35;--line2:#434b57;--demand:#f27a45;--supply:#6aa4f2;--c3:#b595e8;
  --good:#58c88a;--warn:#e0b04a;--bad:#f2837b;--chip:#222831;
  --zone1:#4a3022;--zone2:#7a4a2a;--okfill:#1f3a2b;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,4vw,36px);line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.eq{display:flex;flex-wrap:wrap;gap:8px 14px;font-family:var(--mono);font-size:14px;margin-top:10px}
.eq span{background:var(--chip);padding:4px 10px;border-radius:6px}
.bar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.bar .sep{width:1px;align-self:stretch;background:var(--line)}
.bar .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;font-weight:500;color:var(--fg);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:7px 13px;cursor:pointer}
button:hover{background:var(--chip)}
button:focus-visible,input:focus-visible{outline:2px solid var(--supply);outline-offset:2px}
button.go{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.go:hover{opacity:.88;background:var(--fg)}
button.on{background:var(--chip);border-color:var(--fg)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.charts{display:flex;flex-direction:column;gap:12px;min-width:0}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 10px}
.cap{font-size:13px;color:var(--muted);margin:0 0 6px}
.ctl{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.ctl label{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.ctl output{font-family:var(--mono);color:var(--fg);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--supply)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--chip);border-radius:8px;padding:8px 10px;min-width:0}
.stat.w{grid-column:1/-1}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--mono);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .v.t{font-family:var(--sans);font-size:15px;font-weight:600}
#msg{font-size:14px;color:var(--bad);min-height:21px;margin-top:8px}
svg{display:block;width:100%;height:auto}
svg text{font-family:var(--sans)}
.leg{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.leg i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.leg i.sq{height:10px;width:12px;border-radius:2px}
.hint{font-size:12.5px;color:var(--faint);margin:6px 0 0}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}.bar .sep{display:none}.row2{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

 var e={ic:['y<sub>t+1</sub> = (1+i)·y<sub>t</sub> &nbsp;(compuesto)','y<sub>t</sub> = C·(1+i·t) &nbsp;(simple)'],
  ah:['S<sub>t+1</sub> = (1+i)·S<sub>t</sub> + c','S<sub>t</sub> = (c/i)·[(1+i)<sup>t</sup> − 1]'],
  pr:['V<sub>t+1</sub> = (1+i)·V<sub>t</sub> − c','V₀ = c·[1 − (1+i)<sup>−n</sup>]/i']};
 $('e1').innerHTML=e[m][0];$('e2').innerHTML=e[m][1];An.full()}
function series(p){var n=p.n,i=p.i,a=[],b=[],tot=[];
 if(mode==='ic'){for(var t=0;t<=n;t++){a.push(p.C0*(1+i*t));b.push(p.C0*Math.pow(1+i,t))}}
 else if(mode==='ah'){var S=0;for(var t=0;t<=n;t++){a.push(p.c*t);b.push(S);S=(1+i)*S+p.c}}
 else{var V=p.c*(1-Math.pow(1+i,-n))/i;for(var t=0;t<=n;t++){b.push(V);V=(1+i)*V-p.c;if(Math.abs(V)<1e-6)V=0}}
 return{a:a,b:b}}
function render(){
 var p=prm(),n=p.n,s=series(p),u=Math.min(An.u,n),k=Math.min(Math.floor(u+1e-9),n),fr=u-k;
 $('o_sp')&&0;var i=p.i,A=1+i;
 var st=$('stats');
 var A_=F(A,3);
 var leg='',o='',q='';
 var f,yr;
 var vis=function(arr){var r=arr.slice(0,k+1);if(k<n&&fr>1e-6)r.push(arr[k]+(arr[k+1]-arr[k])*fr);return r};
 function pts(arr){var r=[];for(var j=0;j<=k;j++)r.push([j,arr[j]]);if(k<n&&fr>1e-6)r.push([k+fr,arr[k]+(arr[k+1]-arr[k])*fr]);return r}
 if(mode==='ic'){
  var big=s.b[n];yr=[0,Math.max(s.a[n],big)*1.08];f=frame(680,300,62,16,12,28,0,n,yr[0],yr[1]);
  o=clip('cA',f)+axes(f,{xt:ticks(0,n,10),yt:ticks(yr[0],yr[1],5),xl:'t (períodos)',yl:'Monto',yf:function(v){return F(v,0)}});
  o+='<g clip-path="url(#cA)">'+poly(f,pts(s.a),'var(--supply)',2.4,3)+poly(f,pts(s.b),'var(--demand)',2.4,3)+'</g>';
  if(k<n&&fr>1e-6){var fv=function(arr){return arr[k]+(arr[k+1]-arr[k])*fr};o+=tip(f,k+fr,fv(s.a),'var(--supply)')+tip(f,k+fr,fv(s.b),'var(--demand)')}
  leg='<span><i style="background:var(--demand)"></i>Compuesto C(1+i)<sup>t</sup></span><span><i style="background:var(--supply)"></i>Simple C(1+i·t)</span>';
  var dif=[];for(var j=0;j<=n;j++)dif.push(s.b[j]-s.a[j]);var dm=Math.max.apply(null,dif)*1.15+1e-9;
  var f2=frame(680,150,62,16,10,28,-0.5,n+0.5,0,dm);q=axes(f2,{xt:ticks(0,n,10),yt:ticks(0,dm,3),xl:'t',yl:'Compuesto − simple',yf:function(v){return F(v,0)}});
  var bw=f2.w/(n+1)*0.7;for(var j=0;j<=k;j++){q+='<rect x="'+(f2.X(j)-bw/2)+'" y="'+f2.Y(dif[j])+'" width="'+bw+'" height="'+Math.max(0,f2.Y(0)-f2.Y(dif[j]))+'" style="fill:var(--demand);opacity:.75"/>'}
  $('l2').textContent='Cuánto le saca el compuesto al simple en cada período.';
  var dbl=Math.log(2)/Math.log(1+i);
  st.innerHTML=stat0('A = 1 + i',A_)+stat0('B','0')+stat0('Compuesto en t = '+n,M(s.b[n]))+stat0('Simple en t = '+n,M(s.a[n]))+stat0('Diferencia',M(s.b[n]-s.a[n]))+stat0('Duplicación (compuesto)',F(dbl,1)+' períodos')+stat0('Duplicación (simple)',F(1/i,1)+' períodos');
 }else if(mode==='ah'){
  var tot=s.b[n];yr=[0,tot*1.08];f=frame(680,300,62,16,12,28,0,n,yr[0],yr[1]);
  o=clip('cA',f)+axes(f,{xt:ticks(0,n,10),yt:ticks(yr[0],yr[1],5),xl:'t (períodos)',yl:'Saldo acumulado',yf:function(v){return F(v,0)}});
  o+='<g clip-path="url(#cA)">'+poly(f,pts(s.a),'var(--supply)',2,0,'5 4')+poly(f,pts(s.b),'var(--demand)',2.6,3)+'</g>';
  if(k<n&&fr>1e-6)o+=tip(f,k+fr,s.b[k]+(s.b[k+1]-s.b[k])*fr,'var(--demand)');
  leg='<span><i style="background:var(--demand)"></i>Saldo S<sub>t</sub> con intereses</span><span><i style="background:var(--supply)"></i>Solo aportes c·t</span>';
  var f2=frame(680,150,62,16,10,28,-0.5,n+0.5,0,tot*1.08);q=axes(f2,{xt:ticks(0,n,10),yt:ticks(0,tot,3),xl:'t',yl:'Aportes e intereses',yf:function(v){return F(v,0)}});
  var bw=f2.w/(n+1)*0.7;for(var j=1;j<=k;j++){var ap=s.a[j],it=s.b[j]-s.a[j];
   q+='<rect x="'+(f2.X(j)-bw/2)+'" y="'+f2.Y(ap)+'" width="'+bw+'" height="'+(f2.Y(0)-f2.Y(ap))+'" style="fill:var(--supply);opacity:.7"/>';
   q+='<rect x="'+(f2.X(j)-bw/2)+'" y="'+f2.Y(ap+it)+'" width="'+bw+'" height="'+Math.max(0,f2.Y(ap)-f2.Y(ap+it))+'" style="fill:var(--demand);opacity:.85"/>'}
  $('l2').textContent='Azul: lo aportado. Naranja: lo que sumaron los intereses.';
  st.innerHTML=stat0('A = 1 + i',A_)+stat0('B = c',M(p.c))+stat0('Valor final S<sub>n</sub>',M(tot))+stat0('Aportes totales',M(p.c*n))+stat0('Intereses ganados',M(tot-p.c*n))+stat0('Equilibrio y* = −c/i','inestable: '+M(-p.c/i));
 }else{
  var V0=s.b[0];yr=[0,V0*1.08];f=frame(680,300,62,16,12,28,0,n,yr[0],yr[1]);
  o=clip('cA',f)+axes(f,{xt:ticks(0,n,10),yt:ticks(yr[0],yr[1],5),xl:'t (cuotas pagadas)',yl:'Saldo adeudado',yf:function(v){return F(v,0)}});
  o+='<g clip-path="url(#cA)">'+poly(f,pts(s.b),'var(--demand)',2.6,3)+'</g>';
  if(k<n&&fr>1e-6)o+=tip(f,k+fr,s.b[k]+(s.b[k+1]-s.b[k])*fr,'var(--demand)');
  leg='<span><i style="background:var(--demand)"></i>Saldo V<sub>t</sub></span>';
  var cmx=p.c*1.1;var f2=frame(680,150,62,16,10,28,0.5,n+0.5,0,cmx);q=axes(f2,{xt:ticks(1,n,10),yt:ticks(0,p.c,3),xl:'cuota número',yl:'Interés y amortización',yf:function(v){return F(v,0)}});
  var bw=f2.w/(n)*0.7;for(var j=1;j<=k;j++){var intr=i*s.b[j-1],am=p.c-intr;
   q+='<rect x="'+(f2.X(j)-bw/2)+'" y="'+f2.Y(intr)+'" width="'+bw+'" height="'+(f2.Y(0)-f2.Y(intr))+'" style="fill:var(--demand);opacity:.85"/>';
   q+='<rect x="'+(f2.X(j)-bw/2)+'" y="'+f2.Y(p.c)+'" width="'+bw+'" height="'+Math.max(0,f2.Y(intr)-f2.Y(p.c))+'" style="fill:var(--supply);opacity:.7"/>'}
  $('l2').textContent='Cada cuota c se reparte: naranja es interés, azul es amortización de capital.';
  st.innerHTML=stat0('A = 1 + i',A_)+stat0('B = −c',M(-p.c))+stat0('Valor actual V₀',M(V0))+stat0('Total pagado n·c',M(p.c*n))+stat0('Intereses pagados',M(p.c*n-V0))+stat0('Equilibrio y* = c/i','inestable: '+M(p.c/i));
 }
 $('c1').innerHTML=o;$('c2').innerHTML=q;$('leg1').innerHTML=leg;
 $('vt').textContent=k+' · '+M(mode==='ic'?s.b[k]:s.b[k])}
function stat0(l,v){return'<div class="stat"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>'}
$('m_ic').onclick=function(){setMode('ic')};$('m_ah').onclick=function(){setMode('ah')};$('m_pr').onclick=function(){setMode('pr')};
$('step').onclick=An.step;$('pl').onclick=An.toggle;$('rs').onclick=An.reset;
bindSliders(['C0','i','n','c','sp'],function(id){An.fit();if(id==='n')An.full();render()});
setMode('ic');

</script>
